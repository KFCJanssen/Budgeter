name: Build & Test

# Checks every branch and pull request on Windows:
#  1. logic tests (BudgetApp.Tests)
#  2. builds BudgetApp.exe exactly like a release (single file)
#  3. runs the app's self-test: upgrades a 1.0 database, imports bank files, makes the PDF and
#     screenshots every page. The screenshots, log and PDF are pushed to the "ci-screenshots" branch.
# (Pushes to main are covered by release.yml, which runs the same checks before releasing.)
on:
  push:
    branches-ignore: [main, ci-screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run tests
        shell: bash
        run: dotnet run --project BudgetApp.Tests -c Release

      - name: Build BudgetApp.exe (same single-file build as a release)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish BudgetApp/BudgetApp.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish -clp:NoSummary 2>&1 | tee build.log

      - name: Screen size for screenshots
        if: ${{ !contains(github.workflow, 'Release') || steps.ver.outputs.exists == 'false' }}
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Self-test (upgrade, imports, PDF, screenshots)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = Resolve-Path "publish/BudgetApp.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', "$PWD\selftest-out" -Wait -PassThru
          if (Test-Path selftest-out/selftest.log) { Get-Content selftest-out/selftest.log }
          exit $p.ExitCode

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/shots"
          mkdir -p "$out"
          cp -r selftest-out/screens "$out/" 2>/dev/null || true
          cp selftest-out/*.png selftest-out/selftest.log selftest-out/*.pdf "$out/" 2>/dev/null || true
          grep -E "error|warning (CS|MC|NU)" build.log | sed 's/^.*\\BudgetApp\\//' | sort -u > "$out/build-errors.txt" 2>/dev/null || true
          cd "$out"
          stat -c %s "$GITHUB_WORKSPACE/publish/BudgetApp.exe" > EXE_SIZE 2>/dev/null || true
          echo "$GITHUB_SHA $GITHUB_REF_NAME" > COMMIT
          ls -l "$GITHUB_WORKSPACE/publish/BudgetApp.exe" | awk '{print $5}' > EXE_SIZE 2>/dev/null || true
          git init -q -b ci-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Self-test output for $GITHUB_SHA"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
